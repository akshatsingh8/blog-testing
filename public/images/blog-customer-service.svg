<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="720" rx="32" fill="#DCEFE0"/>
  <circle cx="1040" cy="110" r="320" stroke="#9CCCAD" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="1040" cy="110" r="220" stroke="#B8DCC0" stroke-width="2"/>
  
  <!-- Flow curves -->
  <path d="M80 580C210 430 330 420 480 510C590 580 670 560 770 460" stroke="#17654F" stroke-width="4" stroke-linecap="round"/>
  
  <!-- WhatsApp Chat Card Mockup -->
  <g filter="drop-shadow(0px 20px 30px rgba(18, 33, 28, 0.08))">
    <rect x="110" y="90" width="460" height="340" rx="24" fill="#FFFDF7"/>
    <!-- Chat Header -->
    <rect x="110" y="90" width="460" height="64" rx="24" fill="#0B4E3D"/>
    <rect x="110" y="130" width="460" height="24" fill="#0B4E3D"/>
    <circle cx="146" cy="122" r="18" fill="#116B52"/>
    <text x="146" y="127" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', Arial, sans-serif" font-size="14" font-weight="700">QR</text>
    <text x="176" y="118" fill="#FFFFFF" font-family="'DM Sans', Arial, sans-serif" font-size="14" font-weight="600">QuickReach Assistant</text>
    <text x="176" y="134" fill="#9CCCAD" font-family="'DM Sans', Arial, sans-serif" font-size="11">WhatsApp · Active within 30s</text>
    
    <!-- Customer Message Bubble -->
    <rect x="160" y="174" width="380" height="54" rx="14" fill="#E6F3E5"/>
    <text x="176" y="196" fill="#12211C" font-family="'DM Sans', Arial, sans-serif" font-size="13" font-weight="500">I want a 3BHK in Bengaluru, budget ₹1.5 Cr</text>
    <text x="520" y="218" text-anchor="end" fill="#7D9387" font-family="'DM Sans', Arial, sans-serif" font-size="10">10:30 AM</text>
    
    <!-- AI Response Bubble -->
    <rect x="130" y="240" width="390" height="74" rx="14" fill="#F4F8F5" stroke="#DCEBE0"/>
    <text x="146" y="264" fill="#17654F" font-family="'DM Sans', Arial, sans-serif" font-size="12" font-weight="700">Intent detected: Real Estate · Whitefield</text>
    <text x="146" y="285" fill="#2E4038" font-family="'DM Sans', Arial, sans-serif" font-size="13">Understood! Here are 3 matching projects.</text>
    <text x="146" y="303" fill="#2E4038" font-family="'DM Sans', Arial, sans-serif" font-size="13">Would you like a site visit scheduled?</text>
    
    <!-- Status Action Pill -->
    <rect x="130" y="330" width="220" height="32" rx="16" fill="#D8F1E4"/>
    <circle cx="146" cy="346" r="6" fill="#116B52"/>
    <text x="160" y="351" fill="#0B4E3D" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="600">Lead Qualified -> Sales Team</text>
    
    <rect x="360" y="330" width="160" height="32" rx="16" fill="#FDEEE3"/>
    <circle cx="376" cy="346" r="6" fill="#F28C45"/>
    <text x="390" y="351" fill="#994D18" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="600">Human Handoff</text>
  </g>
  
  <!-- Lightning 30s Speed Badge -->
  <g transform="translate(920, 420)">
    <circle cx="80" cy="80" r="76" fill="#F28C45" filter="drop-shadow(0 12px 24px rgba(242, 140, 69, 0.35))"/>
    <circle cx="80" cy="80" r="66" fill="#E07931"/>
    <path d="M84 38L62 76H82L76 118L102 72H82L84 38Z" fill="#FFFFFF"/>
    <text x="80" y="132" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', Arial, sans-serif" font-size="12" font-weight="700">30s RESPONSE</text>
  </g>

  <!-- India-first Tag Badge -->
  <g transform="translate(680, 150)">
    <rect width="210" height="52" rx="26" fill="#FFFFFF" stroke="#D1E3D6" stroke-width="1.5" filter="drop-shadow(0 8px 18px rgba(0,0,0,0.04))"/>
    <circle cx="30" cy="26" r="10" fill="#116B52"/>
    <text x="30" y="30" text-anchor="middle" fill="#FFFFFF" font-family="'DM Sans', Arial, sans-serif" font-size="11" font-weight="700">IN</text>
    <text x="50" y="31" fill="#12211C" font-family="'DM Sans', Arial, sans-serif" font-size="13" font-weight="700">India-First WhatsApp AI</text>
  </g>

  <!-- 24/7 Availability Pill -->
  <g transform="translate(640, 240)">
    <rect width="190" height="48" rx="24" fill="#0B4E3D" filter="drop-shadow(0 8px 16px rgba(11,78,61,0.25))"/>
    <text x="24" y="30" fill="#D8F1E4" font-family="'Space Grotesk', Arial, sans-serif" font-size="15" font-weight="700">24/7 Availability</text>
    <circle cx="160" cy="24" r="6" fill="#38D39F"/>
  </g>

  <!-- Bottom Headline Overlay -->
  <text x="110" y="628" fill="#17654F" font-family="'Space Grotesk', Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.03em">Conversational AI for Customer Service</text>
  <text x="110" y="666" fill="#4B6358" font-family="'DM Sans', Arial, sans-serif" font-size="19" font-weight="500">Fast lead response · WhatsApp automation · Human handoff</text>
</svg>
